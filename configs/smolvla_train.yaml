# Dataset & Output
dataset:
  repo_id: yhbcode000/so101_grab

output_dir: outputs/train/smolvla_grab
job_name: smolvla_grab

# Policy Settings
policy:
  type: smolvla
  path: lerobot/smolvla_base
  device: cuda
  push_to_hub: false

# Training Hyperparameters
batch_size: 1
steps: 20000
save_freq: 2000

# Logging (Weights & Biases)
wandb:
  enable: true

# Evaluation Settings
eval:
  freq: 1000
  batch_size: 10
  n_episodes: 10